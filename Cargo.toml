[package]
name = "ragas"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "Rust core for embeddable RAG/LLM evaluation."
readme = "README.md"
keywords = ["rag", "llm", "evaluation", "ragas", "nlp"]
categories = ["science", "text-processing"]
# repository = "https://github.com/<your-org>/ragas-rs"  # set this when you create the public repo

[features]
default = ["runtime-tokio"]
runtime-tokio = []
providers-openai = []
integrations = []
benchmarks = []

[dependencies]
async-trait = "0.1"
csv = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
