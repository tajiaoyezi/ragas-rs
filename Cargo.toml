[package]
name = "ragas"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Rust core for embeddable RAG/LLM evaluation."

[dependencies]
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
