name: ci

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Build
        run: cargo build --all-targets
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      # The optional `tokenizer` feature (tiktoken-rs) is off by default; cover it explicitly so
      # the feature-gated token-counting code does not bit-rot.
      - name: Clippy (tokenizer feature)
        run: cargo clippy --all-targets --features tokenizer -- -D warnings
      - name: Test (tokenizer feature)
        run: cargo test --features tokenizer
